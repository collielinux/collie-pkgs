name: Publish package repo

# Builds the Collie-owned package set per architecture, signs the repo
# databases with COLLIE_GPG_PRIVATE_KEY, and publishes a `package-repo`
# release whose assets the tsuchi sync timer pulls into /srv/pkgs.
#
# Layout produced per arch (matches what pacman expects under
# [collie] Server = .../collie/$arch):
#   repo-$arch.tar.gz -> collie.db.tar.gz{,.sig}, collie.files.tar.gz{,.sig},
#                        *.pkg.tar.zst{,.sig}

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "pkgbuilds/collie-keyring/**"
      - "pkgbuilds/collie-nvim/**"
      - "pkgbuilds/collie-screensaver/**"
      - "pkgbuilds/shear/**"
      - "pkgbuilds/tally/**"
      - "pkgbuilds/snip/**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: ghcr.io/archlinux/archlinux:latest
          - arch: aarch64
            runner: namespace-profile-collie-arm64
            # Pinned to the same digest the ISO builder uses: :latest's newer
            # pacman sandboxes via Landlock, which the Namespace ARM kernel
            # lacks. --disable-sandbox covers any residual drift.
            image: ghcr.io/menci/archlinuxarm@sha256:3e1074c407fc1a57c2a2117af6920c96a7cc906fa6f1f2da8a4a7fd3aa2c2f4e
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build packages and repo database (${{ matrix.arch }})
        env:
          COLLIE_GPG_PRIVATE_KEY: ${{ secrets.COLLIE_GPG_PRIVATE_KEY }}
          SIGNING_KEYID: 9F3E21B3409AD8BE7F052F40880D5BEFD2163444
        run: |
          mkdir -p repo-out
          docker run --rm \
            -e COLLIE_GPG_PRIVATE_KEY \
            -e SIGNING_KEYID \
            -v "$PWD:/src" -w /src \
            "${{ matrix.image }}" bash -euo pipefail -c '
              pacman -Syy --disable-sandbox --noconfirm --needed base-devel git pacman-contrib

              useradd -m -s /bin/bash builder
              mkdir -p /repo/pkgbuilds /repo/out /repo/gnupg
              chmod 700 /repo/gnupg
              # Signing runs as root against a dedicated GNUPGHOME (the same
              # pattern as bin/publish-artifact): repo-add and gpg need no
              # unprivileged user, and this keeps su -- which flaked once with
              # a spurious "user does not exist" -- to the makepkg steps that
              # genuinely require one.
              printf "%s" "$COLLIE_GPG_PRIVATE_KEY" | GNUPGHOME=/repo/gnupg gpg --batch --import

              shopt -s nullglob
              packages="collie-keyring collie-nvim collie-screensaver shear tally snip"
              for pkg in $packages; do
                echo "=== Building $pkg ==="
                cp -a "/src/pkgbuilds/$pkg" "/repo/pkgbuilds/$pkg"
                chown -R builder:builder "/repo/pkgbuilds/$pkg"
                # depends too: collie-nvim needs neovim at build time and it
                # lives in depends, not makedepends. optdepends/checkdepends
                # are excluded by the anchored alternation.
                makedeps=$(su builder -c "cd /repo/pkgbuilds/$pkg && makepkg --printsrcinfo" 2>/dev/null \
                  | sed -n "s/^[[:space:]]*\(makedepends\|depends\) = //p" | tr " " "\n" \
                  | sed "s/[<>=].*//" | sort -u)
                if [[ -n $makedeps ]]; then
                  # shellcheck disable=SC2086
                  pacman -S --disable-sandbox --needed --noconfirm $makedeps
                fi
                su builder -c "cd /repo/pkgbuilds/$pkg && \
                  HOME=/home/builder makepkg --noconfirm --skippgpcheck \
                  --skipchecksums --nodeps -f"
                mv /repo/pkgbuilds/$pkg/*.pkg.tar.* /repo/out/
              done

              # Fail loudly rather than publish a partial repo.
              built=(/repo/out/*.pkg.tar.zst /repo/out/*.pkg.tar.xz)
              if (( ${#built[@]} != 6 )); then
                echo "Expected 6 packages in /repo/out, found ${#built[@]}:" >&2
                printf "  %s\n" "${built[@]}" >&2
                exit 1
              fi

              cd /repo/out
              # pacman.conf requires package signatures (SigLevel = Required
              # DatabaseOptional), so each package gets a detached .sig that
              # repo-add embeds into the database and we ship alongside it.
              # Explicit extensions only: *.pkg.tar.* would also match the
              # .sig files once they exist.
              for f in ./*.pkg.tar.zst ./*.pkg.tar.xz; do
                GNUPGHOME=/repo/gnupg gpg --batch --yes --pinentry-mode loopback \
                  --local-user "$SIGNING_KEYID" --detach-sign --no-armor "$f"
              done
              # -s signs the database itself; -k selects the key. Arch Linux
              # ARM emits .pkg.tar.xz where x86 emits .pkg.tar.zst.
              GNUPGHOME=/repo/gnupg repo-add -s -k "$SIGNING_KEYID" \
                /repo/out/collie.db.tar.gz ./*.pkg.tar.zst ./*.pkg.tar.xz
              # repo-add leaves gzip duplicates named collie.db/collie.files;
              # pacman only ever fetches the .tar.gz forms.
              rm -f /repo/out/collie.db /repo/out/collie.files
              # arch=any packages are identical on both arches; every job
              # builds the full set so each repo db lists what it ships.
              mkdir -p "/repo/final/${{ matrix.arch }}"
              cp /repo/out/* "/repo/final/${{ matrix.arch }}/"
              tar -czf /src/repo-out/repo-${{ matrix.arch }}.tar.gz -C /repo/final ${{ matrix.arch }}
            '

      - name: Checksum repo archive
        working-directory: repo-out
        run: sha256sum "repo-${{ matrix.arch }}.tar.gz" > "SHA256SUMS.${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.arch }}
          path: repo-out/

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          merge-multiple: true
          path: assets

      - name: Publish package-repo release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout step in this job, so gh cannot detect the repo.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd assets
          cat SHA256SUMS.* > SHA256SUMS
          rm -f SHA256SUMS.*
          # Recreate the release each publish so target_commitish tracks the
          # commit; the tsuchi sync uses it to detect new snapshots.
          gh release delete package-repo --yes --cleanup-tag 2>/dev/null || true
          gh release create package-repo --prerelease \
            --target "${{ github.sha }}" \
            --title "Collie package repo" --notes "Rolling snapshot consumed by the tsuchi sync."
          gh release upload package-repo repo-*.tar.gz SHA256SUMS
